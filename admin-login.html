<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Administrador - APP Asistencia">
    <title>Login Administrador - APP Asistencia</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-page">
    <div class="navbar">
        <button onclick="location.href='index.html'" class="btn-back">
            <i data-lucide="arrow-left"></i>
            Volver
        </button>
    </div>

    <div class="container-login">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i data-lucide="lock"></i>
                </div>
                <h1>Panel de Administrador</h1>
                <p>Ingresa tus credenciales</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        placeholder="administracion@gmail.com"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        placeholder="Ingresa tu contraseña"
                    >
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i data-lucide="alert-circle"></i>
                    <span></span>
                </div>

                <button type="submit" class="btn-login">
                    <i data-lucide="log-in"></i>
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p>Credenciales de demostración:</p>
                <p><strong>Email:</strong> administracion@gmail.com</p>
                <p><strong>Contraseña:</strong> demo123</p>
            </div>
        </div>
    </div>

    <div class="background-decoration">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <script src="admin.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
