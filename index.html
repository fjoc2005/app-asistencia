<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Asistencia con Sincronización en Tiempo Real">
    <title>APP Asistencia - Sincronización en Tiempo Real</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- QR Reader -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    
    <!-- QR Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Print Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="main-page">
    <div class="container-main">
        <div class="logo-section animate-fade-in">
            <div class="logo-icon">
                <i data-lucide="clipboard-check"></i>
            </div>
            <h1>APP <span class="highlight">Asistencia</span></h1>
            <p class="tagline">Sistema de registro sincronizado en tiempo real</p>
        </div>

        <div class="main-action animate-scale-in">
            <button class="btn-main" onclick="location.href='registro.html'">
                <i data-lucide="qr-code"></i>
                <span>ESCANEAR QR</span>
            </button>
        </div>

        <div class="secondary-actions animate-fade-in-delay">
            <a href="admin-login.html" class="btn-ghost">
                <i data-lucide="settings"></i>
                Acceso Administrador
            </a>
        </div>

        <div class="status-info animate-fade-in-delay">
            <div id="firebaseStatus" class="status-badge">
                <i data-lucide="wifi-off"></i>
                <span>Conectando...</span>
            </div>
        </div>

        <div class="branding-footer-home animate-fade-in-delay">
            <div class="branding-light">
                Sintramae - Sistema de Asistencia Sincronizado
            </div>
        </div>
    </div>

    <div class="background-decoration">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        lucide.createIcons();
        
        // Initialize Firebase on page load
        window.addEventListener('load', async () => {
            const initialized = await initializeFirebase();
            const statusBadge = document.getElementById('firebaseStatus');
            
            if (initialized) {
                statusBadge.className = 'status-badge connected';
                statusBadge.innerHTML = '<i data-lucide="wifi"></i><span>Conectado</span>';
            } else {
                statusBadge.className = 'status-badge error';
                statusBadge.innerHTML = '<i data-lucide="wifi-off"></i><span>Desconectado</span>';
            }
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
